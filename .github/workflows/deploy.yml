name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Pushes that touch nothing the site ships from do not redeploy. The
    # documentation lives in corevalley-docs/ (docs.corevalley.ai, see the
    # "Build docs site" step); the root docs/ folder is internal engineering notes.
    paths-ignore:
      - "docs/**"
      - "reference/**"
      - "design_system/**"
      - "files/**"
      - ".github/workflows/verify.yml"
      - "README.md"
      - "SEO_roadmap.txt"
      - "doc_cname_readme.txt"
      - "status/**"
      - "drafts/**"
      - "Kathmandu_Core/**"
      - "report_0903.txt"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Valleys_3D/package-lock.json

      # Reads the site's Pages settings and exposes the base path the site
      # will be served from: "/<repo>" for a project site (also when the
      # organisation site has a custom domain, e.g. corevalley.ai/<repo>/),
      # "" for a user site or a custom domain on this repository.
      # `enablement` turns Pages on (source: GitHub Actions) the first time,
      # so the repo needs no manual setup.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      # Fall back to the repo name only when the settings could not be read.
      # An empty base path is a valid answer ("" = served from the domain
      # root), so this must test the step's outcome, not the value — in
      # workflow expressions `'' || x` would silently pick x and every link
      # on a custom-domain site would break.
      - name: Resolve base path and site URL
        id: basepath
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$PAGES_OUTCOME" = "success" ]; then
            base="$PAGES_BASE_PATH"
            origin="$PAGES_ORIGIN"
          else
            echo "::warning::Could not read the Pages settings; assuming a project site at /$REPO_NAME"
            base="/$REPO_NAME"
            origin="https://$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          fi
          # Canonical URLs, the sitemap and structured data all build on this:
          # the address the site is actually served from, base path included.
          # When Pages serves the site from https://corevalley.ai/ it becomes
          # exactly that, with no code change.
          echo "Base path: '${base}'  Site URL: '${origin}${base}'"
          echo "value=${base}" >> "$GITHUB_OUTPUT"
          echo "site_url=${origin}${base}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.basepath.outputs.site_url }}
          # Optional, from repository variables (Settings → Secrets and
          # variables → Actions → Variables). Empty when unset.
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          NEXT_PUBLIC_BING_VERIFICATION: ${{ vars.BING_VERIFICATION }}
          NEXT_PUBLIC_DOCS_URL: ${{ vars.DOCS_URL }}
          NEXT_PUBLIC_STATUS_URL: ${{ vars.STATUS_URL }}

      # The documentation site, docs.corevalley.ai, is this codebase built
      # with NEXT_PUBLIC_BUILD_TARGET=docs. CoreValleyAI/docs builds and
      # publishes it from this repository's main branch on its own (its
      # workflow checks for a new commit every 15 minutes); building it here
      # too keeps a change that breaks the docs from reaching main.
      - name: Build docs site
        run: npm run build:docs

      # Valleys 3D is a separate Vite app, served unlisted at /valleys/. Its
      # build uses a relative base, so it works under any site base path.
      - name: Build Valleys 3D
        working-directory: Valleys_3D
        run: |
          npm ci
          npm run build
          mkdir -p ../out/valleys
          cp -r dist/. ../out/valleys/

      # The next version of the site, built from the `preview` branch and
      # served at /preview/ beside the live site, which stays at the root.
      # To refresh it after pushing to `preview`, re-run this workflow
      # (Actions → Deploy to GitHub Pages → Run workflow).
      - name: Checkout preview branch
        uses: actions/checkout@v5
        with:
          ref: preview
          path: preview-src

      - name: Build /preview
        working-directory: preview-src
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}/preview
          NEXT_PUBLIC_SITE_URL: ${{ steps.basepath.outputs.site_url }}/preview
          # noindex on every page: /preview is a full second copy of the site
          # and must not compete with it in search.
          NEXT_PUBLIC_NOINDEX: "1"
        run: |
          npm ci
          npm run build
          mkdir -p ../out/preview
          cp -r out/. ../out/preview/

      # Packaged here rather than with actions/upload-pages-artifact, whose v4
      # drops every dot-path and with it /.well-known/security.txt. Same
      # tarball and artifact name ("github-pages") that deploy-pages expects.
      - name: Package site
        run: tar --dereference --hard-dereference --directory out -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell IndexNow engines (Bing, Yandex, Seznam, Naver…) every URL in the
      # sitemap may have changed. The key is public by design: it is the file
      # public/<key>.txt, which proves the site owns it. Google does not take
      # IndexNow; it reads the sitemap from Search Console.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEXNOW_KEY: 33ff8a51559595949e0134533bfcd08b
        run: |
          site="${PAGE_URL%/}"
          host="$(echo "$site" | sed -E 's#^https?://##; s#/.*##')"
          urls="$(curl -fsS "$site/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)"
          body="$(jq -nc --arg host "$host" --arg key "$INDEXNOW_KEY" --arg loc "$site/$INDEXNOW_KEY.txt" --argjson urls "$urls" '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')"
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' --data "$body"
