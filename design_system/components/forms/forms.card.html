<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--carbon-900);padding:22px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Switch, Tabs, Icon } = window.CorevalleyDesignSystem_9d3a1a;
const L = ({children}) => <div className="cv-label" style={{marginBottom:7}}>{children}</div>;
function Demo(){
  const [tab,setTab]=React.useState('instances');
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'start'}}>
      <div>
        <L>Search field</L>
        <Input placeholder="search instances" prefix={<Icon name="search" size={15}/>} />
        <div style={{height:14}}/>
        <L>CLI entry</L>
        <Input mono prefix="$" defaultValue="corevalley deploy --gpu h200" />
      </div>
      <div>
        <L>Toggles</L>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <Switch defaultChecked/><span style={{fontFamily:'var(--font-mono)',fontSize:13,color:'var(--ink-300)'}}>auto-scale</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Switch/><span style={{fontFamily:'var(--font-mono)',fontSize:13,color:'var(--ink-300)'}}>spot pricing</span>
        </div>
        <div style={{height:18}}/>
        <L>Tabs</L>
        <Tabs value={tab} onChange={setTab} tabs={[
          {id:'instances',label:'instances',badge:8},
          {id:'storage',label:'storage'},
          {id:'billing',label:'billing'},
        ]}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
