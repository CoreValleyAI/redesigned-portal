<!-- @dsCard group="Brand" viewport="700x220" name="Wordmark — corevalley" subtitle="Two-tone lockup · core = Slate #616161 · valley = Hydro #2BDA75 · always lowercase" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);font-family:var(--font-mono);min-height:220px;display:flex;flex-direction:column}
  .stage{flex:1;display:grid;grid-template-rows:1fr 1fr}
  .pane{display:flex;align-items:center;padding:0 40px;gap:18px}
  .carbon{background:var(--carbon-900)}
  .light{background:#EDEFF2;border-top:1px solid var(--border-subtle)}
  .pane img{height:38px}
  .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .light .tag{color:#7A828C}
  .meta{padding:11px 22px;border-top:1px solid var(--border-subtle);font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
  .meta b{color:var(--ink-300);font-weight:500}
</style>
</head>
<body>
  <div class="stage">
    <div class="pane carbon"><img src="../assets/logo/cv-wordmark-green.svg" alt="corevalley wordmark, green"><span class="tag">On Carbon → Hydro green</span></div>
    <div class="pane light"><img src="../assets/logo/cv-wordmark.svg" alt="corevalley wordmark, two-tone"><span class="tag">On light → two-tone</span></div>
  </div>
  <div class="meta"><b>Never</b> capitalize · recolor the split · stretch · or set in a substitute typeface</div>
</body>
</html>
