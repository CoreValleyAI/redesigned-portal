<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — measured, technical rhythm" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:22px;font-family:var(--font-mono)}
  .row{display:flex;gap:16px;align-items:flex-end}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{background:var(--hydro);border-radius:var(--radius-xs)}
  .n{font-size:10px;color:var(--mute)}
</style>
</head>
<body>
  <div class="row">
    <div class="b"><div class="box" style="width:4px;height:4px"></div><div class="n">1·4</div></div>
    <div class="b"><div class="box" style="width:8px;height:8px"></div><div class="n">2·8</div></div>
    <div class="b"><div class="box" style="width:12px;height:12px"></div><div class="n">3·12</div></div>
    <div class="b"><div class="box" style="width:16px;height:16px"></div><div class="n">4·16</div></div>
    <div class="b"><div class="box" style="width:24px;height:24px"></div><div class="n">6·24</div></div>
    <div class="b"><div class="box" style="width:32px;height:32px"></div><div class="n">8·32</div></div>
    <div class="b"><div class="box" style="width:48px;height:48px"></div><div class="n">12·48</div></div>
    <div class="b"><div class="box" style="width:64px;height:64px"></div><div class="n">16·64</div></div>
  </div>
</body>
</html>
