<!-- @dsCard group="Colors" viewport="700x150" name="Borders & glow" subtitle="Hairline Ink borders on Carbon; Hydro is the only glow" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:22px;font-family:var(--font-mono)}
  .row{display:flex;gap:14px}
  .b{flex:1;height:84px;border-radius:var(--radius-md);background:var(--carbon-700);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .b1{border:1px solid rgba(232,236,239,0.07)}
  .b2{border:1px solid rgba(232,236,239,0.12)}
  .b3{border:1px solid rgba(232,236,239,0.20)}
  .b4{border:1px solid rgba(74,222,128,0.35)}
  .g{box-shadow:0 0 20px rgba(74,222,128,0.40);border:1px solid rgba(74,222,128,0.35)}
  .t{font-size:10px;color:var(--ink-300)}
  .s{font-size:9px;color:var(--mute)}
</style>
</head>
<body>
  <div class="row">
    <div class="b b1"><div class="t">subtle</div><div class="s">07%</div></div>
    <div class="b b2"><div class="t">default</div><div class="s">12%</div></div>
    <div class="b b3"><div class="t">strong</div><div class="s">20%</div></div>
    <div class="b b4"><div class="t" style="color:var(--hydro)">hydro</div><div class="s">active</div></div>
    <div class="b g"><div class="t" style="color:var(--hydro)">glow-md</div><div class="s">cursor · focus</div></div>
  </div>
</body>
</html>
