<!-- @dsCard group="Colors" viewport="700x150" name="Ink & neutral text" subtitle="Text ramp on Carbon — Ink is body, Mute is labels only" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:22px}
  .row{display:flex;gap:0;align-items:stretch;font-family:var(--font-body)}
  .col{flex:1;padding:4px 0}
  .lab{font-family:var(--font-mono);font-size:18px;font-weight:500;line-height:1.2}
  .nm{font-family:var(--font-mono);font-size:11px;color:var(--mute);margin-top:8px}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-600);margin-top:2px;text-transform:uppercase}
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="lab" style="color:#F7F9FA">Aa</div><div class="nm">Ink 100</div><div class="hex">#F7F9FA</div></div>
    <div class="col"><div class="lab" style="color:#E8ECEF">Aa</div><div class="nm">Ink 200</div><div class="hex">#E8ECEF</div></div>
    <div class="col"><div class="lab" style="color:#C2C8CF">Aa</div><div class="nm">Ink 300</div><div class="hex">#C2C8CF</div></div>
    <div class="col"><div class="lab" style="color:#9AA2AD">Aa</div><div class="nm">Ink 400</div><div class="hex">#9AA2AD</div></div>
    <div class="col"><div class="lab" style="color:#6B7280">Aa</div><div class="nm">Mute 500</div><div class="hex">#6B7280</div></div>
    <div class="col"><div class="lab" style="color:#4B515C">Aa</div><div class="nm">Ink 600</div><div class="hex">#4B515C</div></div>
    <div class="col"><div class="lab" style="color:#333944">Aa</div><div class="nm">Ink 700</div><div class="hex">#333944</div></div>
  </div>
</body>
</html>
