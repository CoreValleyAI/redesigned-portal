<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:22px;font-family:var(--font-mono)}
  .row{display:flex;gap:16px}
  .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px}
  .sq{width:100%;height:58px;background:var(--carbon-600);border:1px solid var(--border-hydro)}
  .n{font-size:10px;color:var(--mute)}
</style>
</head>
<body>
  <div class="row">
    <div class="b"><div class="sq" style="border-radius:2px"></div><div class="n">xs · 2</div></div>
    <div class="b"><div class="sq" style="border-radius:4px"></div><div class="n">sm · 4</div></div>
    <div class="b"><div class="sq" style="border-radius:6px"></div><div class="n">md · 6</div></div>
    <div class="b"><div class="sq" style="border-radius:10px"></div><div class="n">lg · 10</div></div>
    <div class="b"><div class="sq" style="border-radius:14px"></div><div class="n">xl · 14</div></div>
    <div class="b"><div class="sq" style="border-radius:999px"></div><div class="n">pill</div></div>
  </div>
</body>
</html>
