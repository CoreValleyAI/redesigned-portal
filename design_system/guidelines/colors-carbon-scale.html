<!-- @dsCard group="Colors" viewport="700x150" name="Carbon surface scale" subtitle="Dark elevations — base ground up to pressed surface" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:22px;font-family:var(--font-mono)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--border-default);padding:12px;height:78px;display:flex;flex-direction:column;justify-content:flex-end}
  .nm{font-size:11px;color:var(--ink-300);font-weight:500}
  .hex{font-size:10px;color:var(--mute);margin-top:3px;text-transform:uppercase}
  .role{font-size:9px;color:var(--ink-400);font-family:var(--font-body);margin-top:5px}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#05080D"><div class="nm">900</div><div class="hex">#05080D</div><div class="role">base ground</div></div>
    <div class="sw" style="background:#080C13"><div class="nm">800</div><div class="hex">#080C13</div><div class="role">sunken</div></div>
    <div class="sw" style="background:#0B0F17"><div class="nm">700</div><div class="hex">#0B0F17</div><div class="role">card</div></div>
    <div class="sw" style="background:#11161F"><div class="nm">600</div><div class="hex">#11161F</div><div class="role">raised</div></div>
    <div class="sw" style="background:#181E29"><div class="nm">500</div><div class="hex">#181E29</div><div class="role">input · hover</div></div>
    <div class="sw" style="background:#232B38"><div class="nm">400</div><div class="hex">#232B38</div><div class="role">pressed</div></div>
  </div>
</body>
</html>
