<!-- @dsCard group="Type" viewport="700x200" name="Body — Manrope" subtitle="Headlines & marketing. Headlines tight, body light @ 1.6" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:24px;font-family:var(--font-body)}
  h2{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--ink-100);margin:0}
  p{font-weight:300;font-size:15px;line-height:1.6;color:var(--ink-300);margin:14px 0 0;max-width:560px}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-top:14px}
</style>
</head>
<body>
  <h2>Headlines set tight.</h2>
  <p>Body copy stays light-weight and generously spaced — Manrope 300 at 1.6 line-height keeps long technical passages readable on dark ground.</p>
  <div class="cap">Manrope · 300–800</div>
</body>
</html>
