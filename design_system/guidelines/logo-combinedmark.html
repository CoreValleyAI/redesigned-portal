<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

</head>
<body>
  <div class="hero"><img src="../assets/logo/cv-combinedmark-green.svg" alt="Corevalley primary logo"></div>
  <div class="meta">
    <span><b>Clear space</b> ≥ height of the mark on all sides</span>
    <span><b>Min width</b> 120px digital</span>
    <span><b>Variants</b> green (default on Carbon) · white · two-tone on light · gradient mark</span>
  </div>

</html>
