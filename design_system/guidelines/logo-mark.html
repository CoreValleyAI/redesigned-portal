<!-- @dsCard group="Brand" viewport="700x300" name="Brand mark — cloud / CV" subtitle="Pictorial mark · gradient Mint→Emerald · the download-cloud CV monogram" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);font-family:var(--font-mono);min-height:300px;display:flex;flex-direction:column}
  .stage{flex:1;display:grid;grid-template-columns:1.3fr 1fr}
  .pane{display:flex;align-items:center;justify-content:center}
  .carbon{background:var(--carbon-900)}
  .light{background:#EDEFF2;border-left:1px solid var(--border-subtle)}
  .pane img{height:150px}
  .light img{height:108px}
  .meta{padding:12px 22px;border-top:1px solid var(--border-subtle);display:flex;gap:24px;font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
  .meta b{color:var(--ink-300);font-weight:500}
</style>
</head>
<body>
  <div class="stage">
    <div class="pane carbon"><img src="../assets/logo/cv-brandmark.svg" alt="Corevalley cloud / CV mark"></div>
    <div class="pane light"><img src="../assets/logo/cv-brandmark.svg" alt="Corevalley mark on light"></div>
  </div>
  <div class="meta">
    <span><b>Gradient</b> #6BF4A6 → #1DCC6F</span>
    <span><b>Use</b> app icon · favicon · standalone monogram</span>
    <span><b>White variant</b> cv-brandmark-white.svg for photos / busy grounds</span>
  </div>
</body>
</html>
