<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="Display in mono, steps from 5xl down to caption" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:22px}
  .r{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--border-subtle)}
  .r:last-child{border-bottom:0}
  .s{font-family:var(--font-body);font-weight:700;letter-spacing:-.02em;color:var(--ink-100);line-height:1.1}
  .m{font-family:var(--font-mono);font-size:10px;color:var(--mute);margin-left:auto;white-space:nowrap}
</style>
</head>
<body>
  <div class="r"><div class="s" style="font-size:42px">Compute on rivers</div><div class="m">3xl · 42</div></div>
  <div class="r"><div class="s" style="font-size:32px">Compute on rivers</div><div class="m">2xl · 32</div></div>
  <div class="r"><div class="s" style="font-size:24px">Compute on rivers</div><div class="m">xl · 24</div></div>
  <div class="r"><div class="s" style="font-size:20px;font-weight:600">Compute on rivers</div><div class="m">lg · 20</div></div>
  <div class="r"><div class="s" style="font-size:15px;font-weight:300">Compute on rivers, not coal.</div><div class="m">base · 15</div></div>
  <div class="r"><div class="s" style="font-size:12px;font-weight:400;color:var(--mute)">Compute on rivers, not coal.</div><div class="m">xs · 12</div></div>
</body>
</html>
