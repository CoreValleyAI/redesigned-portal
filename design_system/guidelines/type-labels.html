<!-- @dsCard group="Type" viewport="700x130" name="Mono labels & CLI" subtitle="Uppercase mono eyebrows + the terminal command surface" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--carbon-900);padding:22px;font-family:var(--font-mono)}
  .lab{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .cli{margin-top:16px;background:var(--carbon-800);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:13px 15px;font-size:14px;color:var(--ink-200)}
  .cli .p{color:var(--hydro)}
  .cli .f{color:var(--ink-400)}
</style>
</head>
<body>
  <div class="lab">At a glance · Color usage · Typography</div>
  <div class="cli"><span class="p">$</span> corevalley deploy <span class="f">--region</span> np-ktm-1 <span class="f">--gpu</span> h200</div>
</body>
</html>
