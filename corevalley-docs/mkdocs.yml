site_name: CoreValley Documentation
site_description: Nepal's Sovereign AI Cloud — documentation, guides, and API reference.

# NOTE: the website renders these Markdown files itself (see the repo README,
# "Documentation"). This config is for an optional standalone MkDocs build
# (`npm run docs:mkdocs` → corevalley-docs/site/), which the site never ships.
site_url: !ENV [DOCS_SITE_URL, "https://docs.corevalley.ai"]

repo_name: CoreValleyAI/docs
repo_url: https://github.com/CoreValleyAI/docs

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: cv-brandmark
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/brand.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true

extra:
  # Where the header logo links to: the marketing site the docs live under.
  homepage: !ENV [DOCS_HOMEPAGE, "https://corevalley.ai"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/corevalley
    - icon: fontawesome/brands/slack
      link: https://corevalley.slack.com
  generator: false

nav:
  - Home: index.md
  - Platform:
      - AI Lab: platform/ai-lab.md
      - GPU Workspace: platform/gpu-workspace.md
      - Inference API: platform/inference.md
  - Hardware:
      - GPU & Instance Specs: hardware/specs.md
  - Billing:
      - NPR Payments: billing/npr-payments.md
  - Guides:
      - Quickstart: guides/quickstart.md
  - Support:
      - SLA & Contact: support/sla-and-contact.md
